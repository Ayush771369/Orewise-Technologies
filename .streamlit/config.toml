
[theme]
base = "light"

# OreWise brand colours
primaryColor = "#E69B45"
backgroundColor = "#F3F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#182D3D"

# Typography
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"

# Modern component styling
baseRadius = "large"
buttonRadius = "medium"
borderColor = "#DCE3E8"
showWidgetBorder = true
showSidebarBorder = false

# Engineering chart colours
chartCategoricalColors = [
    "#E69B45",
    "#18364D",
    "#7192A7",
    "#8DB9A6",
    "#AEB8C2"
]

[theme.sidebar]
backgroundColor = "#142638"
secondaryBackgroundColor = "#203B50"
textColor = "#F3F5F7"
primaryColor = "#E69B45"
font = "sans-serif"
